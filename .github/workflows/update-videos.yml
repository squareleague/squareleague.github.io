name: Update YouTube videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh videos.json
        run: python3 scripts/update_videos.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- videos.json; then
            echo "videos.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update YouTube videos"
          git push
